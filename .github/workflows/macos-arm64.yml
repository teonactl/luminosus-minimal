name: Build macOS (Apple Silicon)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (arm64) hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtwebsockets qt5compat'
          cache: true

      - name: Generate websocket certificate
        run: |
          cd src/core/data
          openssl req -x509 -newkey rsa:4096 -keyout luminosus_websocket.key \
            -out luminosus_websocket.cert -days 3650 -sha256 -nodes \
            -subj "/CN=localhost"

      - name: Configure
        run: |
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks into the app bundle
        # -qmldir is required for macdeployqt to scan the actual .qml sources
        # and bundle the QML plugins they import (Qt5Compat.GraphicalEffects,
        # QtQuick.Dialogs, QtQuick.Window, ...) - without it, only the Qt
        # frameworks linked directly by the C++ binary get deployed, and the
        # app fails to load its QML at runtime with "module ... is not installed".
        run: |
          macdeployqt build/luminosus-minimal.app -qmldir=src

      - name: Ad-hoc code sign
        # No paid Apple Developer certificate is available here, but Apple
        # Silicon refuses to run ANY unsigned arm64 binary outright (not just
        # a Gatekeeper warning like on Intel) - an ad-hoc signature (no
        # identity, just "-") is the minimum needed for it to launch at all.
        run: |
          codesign --force --deep --sign - build/luminosus-minimal.app

      - name: Create dmg
        run: |
          hdiutil create -volname luminosus-minimal -srcfolder build/luminosus-minimal.app \
            -ov -format UDZO build/luminosus-minimal.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: luminosus-minimal-macos-arm64
          path: build/luminosus-minimal.dmg
          if-no-files-found: error
